services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budgefi
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budgefi"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - budgefi-postgres:/var/lib/postgresql/data

volumes:
  budgefi-postgres:
